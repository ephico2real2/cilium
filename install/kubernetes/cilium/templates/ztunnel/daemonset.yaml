{{- if and .Values.encryption.enabled (eq .Values.encryption.type "ztunnel") }}
---
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: ztunnel-cilium
  namespace: {{ include "cilium.namespace" . }}
  {{- with .Values.encryption.ztunnel.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app: ztunnel-cilium
    app.kubernetes.io/part-of: cilium
    app.kubernetes.io/name: ztunnel-cilium
    helm.sh/chart: {{ include "cilium.chart" . }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  revisionHistoryLimit: 10
  {{- if .Values.encryption.ztunnel.minReadySeconds }}
  minReadySeconds: {{ .Values.encryption.ztunnel.minReadySeconds }}
  {{- end }}
  selector:
    matchLabels:
      app: ztunnel-cilium
  {{- with .Values.encryption.ztunnel.updateStrategy }}
  updateStrategy:
    {{- toYaml . | trim | nindent 4 }}
  {{- end }}
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
        {{- with .Values.encryption.ztunnel.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app: ztunnel-cilium
        app.kubernetes.io/part-of: cilium
        app.kubernetes.io/name: ztunnel-cilium
        helm.sh/chart: {{ include "cilium.chart" . }}
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.encryption.ztunnel.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # SPIRE delegated attestation consumes host PIDs reported by node CRI.
      {{- if eq .Values.encryption.ztunnel.ca.type "spire" }}
      hostPID: true
      {{- end }}
      hostNetwork: true
      dnsPolicy: ClusterFirst
      containers:
        - name: istio-proxy
          image: {{ include "cilium.image" .Values.encryption.ztunnel.image | quote }}
          imagePullPolicy: {{ .Values.encryption.ztunnel.image.pullPolicy }}
          args:
            {{- if .Values.encryption.ztunnel.requireMtls }}
            # Older proxy images reject this command rather than silently
            # ignoring the persistent authentication requirement.
            - proxy-mtls
            {{- else }}
            - proxy
            {{- end }}
            - ztunnel
          env:
            - name: XDS_ADDRESS
              value: "https://localhost:15012"
            {{- $rootCA := not (empty .Values.encryption.ztunnel.bootstrap.existingSecret) | ternary "/etc/ztunnel/bootstrap-ca.crt" "/etc/ztunnel/bootstrap-root.crt" }}
            - name: XDS_ROOT_CA
              value: {{ $rootCA | quote }}
            - name: CA_ROOT_CA
              value: {{ $rootCA | quote }}
            - name: CA_ADDRESS
              value: {{ .Values.encryption.ztunnel.caAddress | quote }}
            {{- if eq .Values.encryption.ztunnel.ca.type "spire" }}
            - name: SPIRE_ENABLED
              value: "true"
            - name: SPIRE_ADMIN_ENDPOINT_SOCKET
              value: {{ printf "unix://%s" (include "cilium.ztunnel.spireSocketPath" .) | quote }}
            - name: CONTAINER_RUNTIME_SOCK_PATH
              value: {{ .Values.encryption.ztunnel.spire.containerRuntimeSocketPath | quote }}
            - name: TRUST_DOMAIN
              value: {{ include "cilium.ztunnel.spireTrustDomain" . | quote }}
            # The pinned SPIRE client selects its bundle using cluster_domain.
            - name: CLUSTER_DOMAIN
              value: {{ include "cilium.ztunnel.spireTrustDomain" . | quote }}
            {{- end }}
            - name: ISTIO_META_DNS_CAPTURE
              value: "false"
            - name: INPOD_UDS
              value: "/var/run/cilium/ztunnel.sock"
            # Kubernetes Node metadata.name. Cilium xDS publishes the same
            # native node name in Workload.Node; it is never a node IP.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: INSTANCE_IP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.podIP
            - name: ISTIO_META_ENABLE_HBONE
              value: "true"
            {{- if .Values.encryption.ztunnel.mesh.clusters }}
            # Strict mesh: every non-exempt destination in these ranges is reached over HBONE only.
            # REQUIRE_INBOUND_MTLS repeats proxy-mtls; it keeps the environment a complete record.
            - name: CLUSTER_ID
              value: {{ .Values.cluster.name | quote }}
            - name: REQUIRE_INBOUND_MTLS
              value: "true"
            - name: REQUIRE_MESH_HBONE
              value: "true"
            - name: MESH_EGRESS_CONFIG
              value: {{ include "cilium.ztunnel.meshEgressConfig" .Values.encryption.ztunnel.mesh | quote }}
            {{- end }}
            {{- with .Values.encryption.ztunnel.issuerProfile }}
            {{- if .probePinsDirectory }}
            - name: ISSUER_PROFILE_PROBE_PINS
              value: {{ printf "%s/pins.json" .probePinsDirectory | quote }}
            {{- end }}
            {{- if .checkpointDirectory }}
            - name: ISSUER_PROFILE_CHECKPOINT_DIR
              value: {{ .checkpointDirectory | quote }}
            - name: ISSUER_PROFILE_CHECKPOINT_BOOTSTRAP
              value: {{ .checkpointBootstrap | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.encryption.ztunnel.extraEnv }}
            {{- toYaml . | trim | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: {{ .Values.encryption.ztunnel.healthPort }}
              host: "127.0.0.1"
              scheme: HTTP
            initialDelaySeconds: {{ .Values.encryption.ztunnel.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.encryption.ztunnel.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.encryption.ztunnel.readinessProbe.failureThreshold }}
            successThreshold: 1
            timeoutSeconds: 1
          {{- with .Values.encryption.ztunnel.resources }}
          resources:
            {{- toYaml . | trim | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - NET_ADMIN
                - SYS_ADMIN
                - NET_RAW
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 1337
            runAsNonRoot: false
            runAsUser: 0
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /var/run/cilium
              name: cilium-dir
              readOnly: false
            - mountPath: /etc/ztunnel
              name: cilium-ztunnel-secrets
              readOnly: true
            {{- if eq .Values.encryption.ztunnel.ca.type "spire" }}
            - name: spire-agent-socket
              mountPath: {{ dir (include "cilium.ztunnel.spireSocketPath" .) }}
              readOnly: true
            - name: container-runtime-socket
              mountPath: {{ .Values.encryption.ztunnel.spire.containerRuntimeSocketPath | quote }}
              readOnly: true
            {{- end }}
            {{- with .Values.encryption.ztunnel.issuerProfile }}
            {{- with .probePinsDirectory }}
            - name: issuer-pins
              mountPath: {{ . }}
              readOnly: true
            {{- end }}
            {{- with .checkpointDirectory }}
            - name: issuer-checkpoint
              mountPath: {{ . }}
            {{- end }}
            {{- end }}
            {{- with .Values.encryption.ztunnel.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- with .Values.encryption.ztunnel.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.encryption.ztunnel.nodeSelector }}
      nodeSelector:
        {{- toYaml . | trim | nindent 8 }}
      {{- end }}
      {{- with .Values.encryption.ztunnel.tolerations }}
      tolerations:
        {{- toYaml . | trim | nindent 8 }}
      {{- end }}
      priorityClassName: {{ include "cilium.priorityClass" (list $ .Values.encryption.ztunnel.priorityClassName "system-node-critical") }}
      restartPolicy: Always
      terminationGracePeriodSeconds: {{ .Values.encryption.ztunnel.terminationGracePeriodSeconds }}
      {{- if .Values.serviceAccounts.ztunnel.create }}
      serviceAccountName: {{ .Values.serviceAccounts.ztunnel.name | quote }}
      automountServiceAccountToken: {{ .Values.serviceAccounts.ztunnel.automount }}
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      volumes:
        - name: cilium-dir
          hostPath:
            path: /var/run/cilium
            type: DirectoryOrCreate
        - name: cilium-ztunnel-secrets
          {{- with .Values.encryption.ztunnel.bootstrap.existingSecret }}
          projected:
            defaultMode: 420
            sources:
              - secret:
                  name: {{ . }}
                  items:
                    - key: tls.crt
                      path: bootstrap-root.crt
              {{- include "cilium.ztunnel.caBundleSource" (list $ "bootstrap-ca.crt") | nindent 14 }}
          {{- else }}
          secret:
            secretName: cilium-ztunnel-secrets
            defaultMode: 420
            items:
              - key: bootstrap-root.crt
                path: bootstrap-root.crt
                mode: 420
          {{- end }}
        {{- if eq .Values.encryption.ztunnel.ca.type "spire" }}
        - name: spire-agent-socket
          hostPath:
            path: {{ dir (include "cilium.ztunnel.spireSocketPath" .) }}
            type: DirectoryOrCreate
        - name: container-runtime-socket
          hostPath:
            path: {{ .Values.encryption.ztunnel.spire.containerRuntimeSocketPath | quote }}
            type: Socket
        {{- end }}
        {{- with .Values.encryption.ztunnel.issuerProfile }}
        {{- with .probePinsDirectory }}
        - name: issuer-pins
          hostPath:
            path: {{ . }}
            type: Directory
        {{- end }}
        {{- with .checkpointDirectory }}
        - name: issuer-checkpoint
          hostPath:
            path: {{ . }}
            type: Directory
        {{- end }}
        {{- end }}
        {{- with .Values.encryption.ztunnel.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
