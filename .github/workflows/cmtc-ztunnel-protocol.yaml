name: CMTC ztunnel authorization protocol and lifecycle
on:
  push:
    branches: [feat/cmtc-ztunnel-authorization-protocol, feat/ztunnel-authorization-lifecycle]
  workflow_dispatch:
concurrency:
  group: cmtc-ztunnel-authorization-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  protocol:
    name: Verify ztunnel authorization wire lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout the complete source and vendored xDS dependencies
        uses: actions/checkout@v5
        with: {persist-credentials: false}
      - name: Set up pinned Go toolchain
        uses: actions/setup-go@v6
        with: {go-version: '1.27.1', cache: true}
      - name: Record exact source and Linux toolchain
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source.txt
          go version > artifacts/toolchain.txt
          uname -a > artifacts/platform.txt
      - name: Wire fixtures, real ADS lifecycle and shared delta engine with race detection
        run: |
          set -euo pipefail
          go test -race -json -count=1 -timeout=10m ./pkg/ztunnel/pb/... ./pkg/ztunnel/xds ./pkg/envoy/xds | tee artifacts/tests.jsonl
          go vet ./pkg/ztunnel/pb/... ./pkg/ztunnel/xds ./pkg/envoy/xds
      - name: Exact protobuf generation tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/protoc" "$RUNNER_TEMP/protoc/bin"
          curl -fsSL https://github.com/protocolbuffers/protobuf/releases/download/v33.1/protoc-33.1-linux-x86_64.zip -o "$RUNNER_TEMP/protoc.zip"
          printf '%s  %s\n' f3340e28a83d1c637d8bafdeed92b9f7db6a384c26bca880a6e5217b40a4328b "$RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          export GOBIN="$RUNNER_TEMP/protoc/bin"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          go install github.com/mfridman/protoc-gen-go-json@v1.6.0
          go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@v1.5.1
          echo "$GOBIN" >> "$GITHUB_PATH"
          echo "PROTOC_INCLUDE_DIR=$RUNNER_TEMP/protoc/include" >> "$GITHUB_ENV"
      - name: Generated files are reproducible
        run: |
          bash pkg/ztunnel/pb/security/generate.sh
          git diff --exit-code -- pkg/ztunnel/pb/security
          test -z "$(gofmt -l pkg/ztunnel/pb/security)"
      - name: Retain machine-readable wire-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ztunnel-authorization-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
      - name: Report protocol boundary
        if: always()
        run: |
          {
            echo 'Authorization transport uses the real Go ADS service over in-memory gRPC, with the selected proxy schema.'
            echo 'Tests cover resource versions, update/delete, subscriptions, NACK, reconnect and per-stream ACK isolation.'
            echo 'These tests do not establish Cilium policy compilation, Rust proxy enforcement, remote discovery, workload mTLS or layered encryption.'
          } >> "$GITHUB_STEP_SUMMARY"
