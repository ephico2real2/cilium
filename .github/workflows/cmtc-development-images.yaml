name: CMTC fork development images
on:
  push:
    branches: [ci/ghcr-development-images]
    paths: [.github/workflows/cmtc-development-images.yaml, 'contrib/cmtc-images/**']
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full fork commit to publish (agent, operator, mesh, Hubble Relay and matching chart)
        type: string
        required: true
        default: 93041b3f7ec55ff12c83ecd266f14fb392ea5c93
      local_arm64:
        description: Wait for and reuse the ARM64 images built on your local Mac
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cmtc-images-${{ inputs.source_sha || '93041b3f7ec55ff12c83ecd266f14fb392ea5c93' }}
  cancel-in-progress: false
env:
  SOURCE_SHA: ${{ inputs.source_sha || '93041b3f7ec55ff12c83ecd266f14fb392ea5c93' }}
  IMAGE_REPOSITORY: ghcr.io/ephico2real2/cilium-dev
  REQUIRE_LOCAL_ARM64: ${{ github.event_name == 'push' || inputs.local_arm64 }}
jobs:
  build:
    name: Publish native CMTC images (${{ matrix.arch }})
    if: github.repository == 'ephico2real2/cilium'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - name: Validate immutable source
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Checkout the exact image source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Authenticate to the owned GHCR package
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Wait for the explicitly selected local ARM64 publication
        if: matrix.arch == 'arm64' && env.REQUIRE_LOCAL_ARM64 == 'true'
        timeout-minutes: 30
        run: |
          for attempt in $(seq 1 180); do
            if docker buildx imagetools inspect "$IMAGE_REPOSITORY:sha-$SOURCE_SHA-clustermesh-apiserver-arm64" >/dev/null 2>&1; then exit 0; fi
            echo "Waiting for the local ARM64 build ($attempt/180)"
            sleep 10
          done
          exit 1
      - name: Reuse complete native images already built locally from this source
        id: existing
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          reuse=true
          for role in agent operator-generic clustermesh-apiserver hubble-relay; do
            image="$IMAGE_REPOSITORY:sha-$SOURCE_SHA-$role-$ARCH"
            if ! docker pull "$image"; then reuse=false; break; fi
            revision=$(docker inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
            platform=$(docker inspect "$image" --format '{{.Os}}/{{.Architecture}}')
            [ "$revision" = "$SOURCE_SHA" ] && [ "$platform" = "linux/$ARCH" ] || exit 1
          done
          if [ "$ARCH" = arm64 ] && [ "$REQUIRE_LOCAL_ARM64" = true ] && [ "$reuse" != true ]; then exit 1; fi
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
      - name: Prepare exact native build context
        if: steps.existing.outputs.reuse != 'true'
        run: make -C source GIT_VERSION images/cilium/Dockerfile.dockerignore images/operator/Dockerfile.dockerignore images/clustermesh-apiserver/Dockerfile.dockerignore images/hubble-relay/Dockerfile.dockerignore
      - name: Build and push agent
        if: steps.existing.outputs.reuse != 'true'
        uses: docker/build-push-action@v6
        with:
          context: source
          file: source/images/cilium/Dockerfile
          target: release
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:sha-${{ env.SOURCE_SHA }}-agent-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/ephico2real2/cilium
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          cache-from: type=gha,scope=cmtc-agent-${{ matrix.arch }}
          cache-to: type=gha,scope=cmtc-agent-${{ matrix.arch }},mode=max
      - name: Build and push operator
        if: steps.existing.outputs.reuse != 'true'
        uses: docker/build-push-action@v6
        with:
          context: source
          file: source/images/operator/Dockerfile
          target: release
          platforms: linux/${{ matrix.arch }}
          build-args: OPERATOR_VARIANT=operator-generic
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:sha-${{ env.SOURCE_SHA }}-operator-generic-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/ephico2real2/cilium
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          cache-from: type=gha,scope=cmtc-operator-generic-${{ matrix.arch }}
          cache-to: type=gha,scope=cmtc-operator-generic-${{ matrix.arch }},mode=max
      - name: Build and push ClusterMesh API server
        if: steps.existing.outputs.reuse != 'true'
        uses: docker/build-push-action@v6
        with:
          context: source
          file: source/images/clustermesh-apiserver/Dockerfile
          target: release
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:sha-${{ env.SOURCE_SHA }}-clustermesh-apiserver-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/ephico2real2/cilium
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          cache-from: type=gha,scope=cmtc-clustermesh-apiserver-${{ matrix.arch }}
          cache-to: type=gha,scope=cmtc-clustermesh-apiserver-${{ matrix.arch }},mode=max
      - name: Build and push Hubble Relay
        if: steps.existing.outputs.reuse != 'true'
        uses: docker/build-push-action@v6
        with:
          context: source
          file: source/images/hubble-relay/Dockerfile
          target: release
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:sha-${{ env.SOURCE_SHA }}-hubble-relay-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/ephico2real2/cilium
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          cache-from: type=gha,scope=cmtc-hubble-relay-${{ matrix.arch }}
          cache-to: type=gha,scope=cmtc-hubble-relay-${{ matrix.arch }},mode=max
      - name: Verify published native images and binary version
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p evidence
          for role in agent operator-generic clustermesh-apiserver hubble-relay; do
            image="$IMAGE_REPOSITORY:sha-$SOURCE_SHA-$role-$ARCH"
            docker pull "$image"
            docker inspect "$image" > "evidence/$role.json"
          done
          docker run --rm --entrypoint cilium-dbg "$IMAGE_REPOSITORY:sha-$SOURCE_SHA-agent-$ARCH" version | tee evidence/cilium-version.txt
          grep -F "${SOURCE_SHA:0:8}" evidence/cilium-version.txt
          docker run --rm --entrypoint hubble-relay "$IMAGE_REPOSITORY:sha-$SOURCE_SHA-hubble-relay-$ARCH" version | tee evidence/hubble-relay-version.txt
          grep -F "${SOURCE_SHA:0:8}" evidence/hubble-relay-version.txt
      - name: Retain native source and binary evidence
        uses: actions/upload-artifact@v4
        with:
          name: cilium-images-${{ matrix.arch }}
          path: evidence/
          retention-days: 30
  bundle:
    name: Assemble CMTC development image bundle
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Authenticate to the owned GHCR package
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish multi-architecture source tags and immutable lock
        run: |
          mkdir -p bundle
          for role in agent operator-generic clustermesh-apiserver hubble-relay; do
            tag="$IMAGE_REPOSITORY:sha-$SOURCE_SHA-$role"
            docker buildx imagetools create --tag "$tag" \
              "$tag-amd64" "$tag-arm64"
            docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' > "bundle/$role.json"
          done
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('bundle');sha=os.environ['SOURCE_SHA'];repo=os.environ['IMAGE_REPOSITORY']
          images={}
          for role in ('agent','operator-generic','clustermesh-apiserver','hubble-relay'):
              manifest=json.loads((p/(role+'.json')).read_text())
              digest=manifest['digest']
              images[role]={'image':repo+'@'+digest,'tag':f'{repo}:sha-{sha}-{role}'}
          lock={'source_sha':sha,'repository':repo,'platforms':['linux/amd64','linux/arm64'],'images':images}
          (p/'images.lock.json').write_text(json.dumps(lock,indent=2)+'\n')
          PY
          cat bundle/images.lock.json >> "$GITHUB_STEP_SUMMARY"
      - name: Retain immutable multi-architecture bundle
        uses: actions/upload-artifact@v4
        with:
          name: cilium-image-bundle
          path: bundle/
          retention-days: 90
