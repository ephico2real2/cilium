# PoC routedemo backend and Fortio 1.75.3 (demos 37/39), deliberately on different nodes.
apiVersion: v1
kind: Namespace
metadata: {name: team-a}
---
apiVersion: v1
kind: Namespace
metadata: {name: loadtest}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: shop, namespace: team-a}
spec:
  replicas: 1
  selector: {matchLabels: {app: shop}}
  template:
    metadata: {labels: {app: shop}}
    spec:
      nodeSelector: {kubernetes.io/hostname: poc1-control-plane}
      tolerations: [{key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}]
      containers:
        - name: shop
          image: routedemo:local
          imagePullPolicy: Never
          args: ['-mode', http, '-addr', ':8080']
          env: [{name: APP_NAME, value: shop}]
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: 8080}}
---
apiVersion: v1
kind: Service
metadata: {name: shop, namespace: team-a}
spec:
  selector: {app: shop}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: load, namespace: loadtest}
spec:
  replicas: 1
  selector: {matchLabels: {app: load}}
  template:
    metadata: {labels: {app: load}}
    spec:
      nodeSelector: {kubernetes.io/hostname: poc1-worker}
      containers:
        - name: fortio
          image: fortio/fortio:1.75.3
          args: [server, '-http-port', '8079', '-grpc-port', disabled, '-data-dir', /data]
          volumeMounts: [{name: results, mountPath: /data}]
      volumes: [{name: results, emptyDir: {}}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: shop, namespace: team-a}
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes: {namespaces: {from: Same}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: shop, namespace: team-a}
spec:
  parentRefs: [{name: shop}]
  hostnames: [shop.poc.local]
  rules:
    - backendRefs: [{name: shop, port: 8080}]
---
# L7 inspection emits actual direct-pod HTTP series, populating the source drop-downs.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: http-observe, namespace: team-a}
spec:
  endpointSelector: {matchLabels: {app: shop}}
  ingress:
    - fromEntities: [all]
      toPorts:
        - ports: [{port: '8080', protocol: TCP}]
          rules: {http: [{}]}
